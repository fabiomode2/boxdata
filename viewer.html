<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoxData Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #14181c;
    color: #9ab;
    min-height: 100vh;
  }

  .header {
    background: #1c252b;
    border-bottom: 1px solid #2c3440;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 {
    color: #00b020;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    white-space: nowrap;
  }
  .header h1 span { color: #456; }
  .search-box {
    flex: 1;
    max-width: 500px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #2c3440;
    background: #0f171e;
    color: #cde;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .search-box input:focus { border-color: #00b020; }
  .search-box input::placeholder { color: #456; }
  .file-label {
    background: #1c252b;
    border: 1px dashed #2c3440;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    font-size: 13px;
    color: #678;
    white-space: nowrap;
    transition: all .2s;
  }
  .file-label:hover { border-color: #00b020; color: #9ab; }
  .file-label input { display: none; }
  .stats {
    color: #456;
    font-size: 13px;
    white-space: nowrap;
  }
  .stats span { color: #9ab; font-weight: 600; }

  .drop-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    text-align: center;
  }
  .drop-zone .icon { font-size: 48px; margin-bottom: 16px; opacity: .3; }
  .drop-zone h2 { color: #456; font-size: 18px; font-weight: 500; }
  .drop-zone p { color: #345; font-size: 14px; margin-top: 8px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
    gap: 18px;
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: #1c252b;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    position: relative;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .card .poster {
    width: 100%;
    aspect-ratio: 2/3;
    background: #0f171e;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #345;
    font-size: 12px;
    overflow: hidden;
  }
  .card .poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card .poster .no-poster {
    padding: 20px;
    text-align: center;
    line-height: 1.4;
  }
  .card .info {
    padding: 10px 12px 12px;
  }
  .card .info .title {
    color: #cde;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .info .meta {
    color: #567;
    font-size: 11px;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card .info .meta .rating {
    color: #00b020;
    font-weight: 600;
  }
  .card .info .genres {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .card .info .genres span {
    background: #0f171e;
    color: #567;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: 500;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    z-index: 200;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #1c252b;
    border-radius: 12px;
    max-width: 700px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    display: flex;
    gap: 20px;
    padding: 24px;
    border-bottom: 1px solid #2c3440;
  }
  .modal-header .poster {
    width: 140px;
    min-height: 210px;
    border-radius: 6px;
    background: #0f171e;
    flex-shrink: 0;
    overflow: hidden;
  }
  .modal-header .poster img { width: 100%; display: block; }
  .modal-header .details { flex: 1; min-width: 0; }
  .modal-header .details h2 {
    color: #cde;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
  }
  .modal-header .details .year { color: #567; font-weight: 400; }
  .modal-header .details .tagline {
    color: #678;
    font-size: 14px;
    margin-top: 4px;
  }
  .modal-header .details .meta-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    font-size: 13px;
    flex-wrap: wrap;
  }
  .modal-header .details .meta-row .rating {
    color: #00b020;
    font-weight: 700;
    font-size: 18px;
  }
  .modal-header .details .meta-row .votes { color: #567; }
  .modal-header .details .genres { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .modal-header .details .genres span {
    background: #0f171e;
    color: #678;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 500;
  }
  .modal-body { padding: 24px; }
  .modal-body h3 { color: #678; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .modal-body p { color: #9ab; font-size: 14px; line-height: 1.6; }
  .modal-body .crew { display: flex; gap: 24px; margin-top: 16px; }
  .modal-body .crew div h3 { margin-bottom: 4px; }
  .modal-body .crew div p { color: #cde; font-size: 14px; }
  .modal-body .cast-list { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; }
  .modal-body .cast-list span { color: #9ab; font-size: 13px; }
  .modal-close {
    position: absolute;
    top: 12px; right: 16px;
    background: none; border: none;
    color: #456;
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
  }
  .modal-close:hover { color: #9ab; }
  .modal { position: relative; }

  .loading { text-align: center; padding: 40px; color: #456; font-size: 14px; }

  @media (max-width: 600px) {
    .header { flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 17px; }
    .search-box { max-width: none; }
    .stats { width: 100%; text-align: right; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; padding: 12px; }
    .modal-header { flex-direction: column; }
    .modal-header .poster { width: 100px; min-height: 150px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>boxdata<span>.</span></h1>
  <div class="search-box">
    <input type="text" id="search" placeholder="Search movies…" oninput="render()">
  </div>
  <label class="file-label" id="fileLabel">
    📁 Load JSONL
    <input type="file" accept=".jsonl,.json" id="fileInput">
  </label>
  <div class="stats" id="stats">0 <span>movies</span></div>
</div>

<div class="drop-zone" id="dropZone">
  <div class="icon">🎬</div>
  <h2>Drop a movies.jsonl file here</h2>
  <p>or click <strong>Load JSONL</strong> to open one</p>
</div>

<div class="grid" id="grid"></div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-header" id="modalHeader"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
let movies = [];

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    movies = [];
    const lines = text.split('\n').filter(l => l.trim());
    for (const line of lines) {
      try {
        const m = JSON.parse(line);
        if (m.tmdb_id) movies.push(m);
      } catch(_) {}
    }
    document.getElementById('stats').innerHTML = movies.length + ' <span>movies</span>';
    document.getElementById('dropZone').style.display = 'none';
    render();
  };
  reader.readAsText(file);
}

document.getElementById('fileInput').addEventListener('change', function(e) {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#00b020'; });
dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = '');
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.style.borderColor = '';
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
});

function posterUrl(path, size = 'w185') {
  return path ? `https://image.tmdb.org/t/p/${size}${path}` : null;
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const grid = document.getElementById('grid');
  const filtered = q ? movies.filter(m => m.title?.toLowerCase().includes(q)) : movies;
  grid.innerHTML = filtered.map(m => {
    const rating = m.vote_average > 0 ? `<span class="rating">★ ${m.vote_average.toFixed(1)}</span>` : '';
    const year = m.release_date ? m.release_date.slice(0,4) : '';
    const genres = (m.genres || []).slice(0,3).map(g => `<span>${g}</span>`).join('');
    const url = posterUrl(m.poster_path);
    const poster = url
      ? `<img loading="lazy" src="${url}" alt="${m.title}">`
      : `<div class="no-poster">${m.title?.charAt(0) || '?'}</div>`;
    return `<div class="card" onclick="openModal(${m.tmdb_id})">
      <div class="poster">${poster}</div>
      <div class="info">
        <div class="title">${esc(m.title || '')}</div>
        <div class="meta">${year} ${rating}</div>
        ${genres ? `<div class="genres">${genres}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function openModal(tmdbId) {
  const m = movies.find(x => x.tmdb_id === tmdbId);
  if (!m) return;
  const url = posterUrl(m.poster_path, 'w300');
  const rating = m.vote_average > 0 ? `<span class="rating">★ ${m.vote_average.toFixed(1)}</span>` : '';
  const year = m.release_date ? `<span class="year">${m.release_date.slice(0,4)}</span>` : '';
  const genres = (m.genres || []).map(g => `<span>${esc(g)}</span>`).join('');
  const cast = (m.cast || []).map(c => `<span>${esc(c)}</span>`).join('');
  const director = m.director ? `<div><h3>Director</h3><p>${esc(m.director)}</p></div>` : '';
  const overview = m.overview ? `<h3>Overview</h3><p>${esc(m.overview)}</p>` : '';
  const voteInfo = m.vote_count > 0 ? `<span class="votes">${m.vote_count.toLocaleString()} votes</span>` : '';

  document.getElementById('modalHeader').innerHTML = `
    <div class="poster">${url ? `<img src="${url}" alt="">` : '<div style="padding:40px;text-align:center;color:#345">No poster</div>'}</div>
    <div class="details">
      <h2>${esc(m.title)} ${year}</h2>
      <div class="meta-row">${rating} ${voteInfo}</div>
      ${genres ? `<div class="genres">${genres}</div>` : ''}
    </div>`;

  document.getElementById('modalBody').innerHTML = `
    ${overview}
    <div class="crew">${director}</div>
    ${cast ? `<h3 style="margin-top:16px">Cast</h3><div class="cast-list">${cast}</div>` : ''}`;

  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}
</script>
</body>
</html>
