# Rate limiting zone: 10MB shared memory, 5 requests per minute per IP
limit_req_zone $binary_remote_addr zone=boxdata_api:10m rate=5r/m;

server {
    listen 443 ssl;
    server_name tu-dominio.com;

    # SSL config (existing)
    ssl_certificate /etc/ssl/certs/tu-cert.pem;
    ssl_certificate_key /etc/ssl/private/tu-key.pem;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'" always;
    client_max_body_size 16k;

    # ── API upstream ──
    location /api/ {
        limit_req zone=boxdata_api burst=3 nodelay;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health endpoint (no rate limit) ──
    location /health {
        proxy_pass http://localhost:8000/health;
        proxy_set_header Host $host;
    }
}
